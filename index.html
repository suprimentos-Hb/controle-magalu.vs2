<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Lançamento</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #f5f5f5; padding: 20px; margin:0 }
    .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin:auto }
    h2 { text-align: center; color: #0052cc; }
    label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
    button { width: 100%; padding: 12px; margin-top: 20px; background: #0052cc; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    #mensagem { text-align: center; margin-top: 15px; font-weight: bold; color: green; }
    iframe { display:none } /* iframe oculto pra enviar */
  </style>
</head>
<body>
  <div class="container">
    <h2>Lançamento de Materiais</h2>
    
    <!-- O FORM ENVIA PRA UM IFRAME INVISIVEL -->
    <form id="formSuprimentos" 
          action="https://script.google.com/macros/s/AKfycbwsOokUffRBC97ruSTYnwweMcDL87D49Y8Ut2OtDcUnfQYd_zpXl5iAgeq5xzn1SNR3/exec" 
          method="POST" 
          target="iframe_oculto">
      
      <label for="nome">Nome do Colaborador</label>
      <input type="text" id="nome" name="nome" required>
      
      <label for="area">Área / Setor</label>
      <input type="text" id="area" name="area" required>
      
      <label for="qtd">Quantidade</label>
      <input type="number" id="qtd" name="qtd" min="1" value="1" required>
      
      <label for="produto">Produto</label>
      <select id="produto" name="produto" required>
        <option value="">Selecione o material</option>
        <option value="Fita crepe">Fita crepe</option>
        <option value="Caneta">Caneta</option>
        <option value="Sulfite ( 50 folhas)">Sulfite ( 50 folhas)</option>
        <option value="Caixa De arquivo">Caixa De arquivo</option>
        <!-- Cola o resto dos produtos aqui -->
      </select>

      <button type="submit" id="btnEnviar">Lançar</button>
      <div id="mensagem"></div>
    </form>
  </div>

  <!-- IFRAME OCULTO QUE RECEBE A RESPOSTA -->
  <iframe name="iframe_oculto" onload="mostrarSucesso()"></iframe>

  <script>
    let enviou = false;
    document.getElementById("formSuprimentos").addEventListener("submit", () => {
      enviou = true;
      document.getElementById("btnEnviar").disabled = true;
      document.getElementById("btnEnviar").textContent = "Enviando...";
    });

    function mostrarSucesso(){
      if(enviou){
        document.getElementById("mensagem").textContent = "Lançamento registrado com sucesso!";
        document.getElementById("formSuprimentos").reset();
        document.getElementById("qtd").value = 1;
        document.getElementById("btnEnviar").disabled = false;
        document.getElementById("btnEnviar").textContent = "Lançar";
        enviou = false;
      }
    }
  </script>
</body>
</html>
