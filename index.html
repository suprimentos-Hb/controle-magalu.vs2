<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lançamento de Materiais</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
  .container { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 420px; }
    h2 { text-align: center; color: #0052cc; margin-bottom: 25px; }
    label { font-weight: 600; display: block; margin-top: 15px; margin-bottom: 6px; color: #333; }
    input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; }
    button { width: 100%; padding: 14px; margin-top: 15px; background: #0052cc; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:disabled { background: #aaa; }
  .btn-config { background: #6c757d; font-size: 14px; padding: 10px; }
    #mensagem { text-align: center; margin-top: 15px; font-weight: bold; min-height: 22px; }
  .sucesso { color: #28a745; }
  .erro { color: #dc3545; }
    iframe { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Lançamento de Materiais</h2>

    <form id="formSuprimentos"
          action="https://script.google.com/macros/s/AKfycbzS5FC_qY8Xd5fmQYQ1V1kCUgQ9LccT2KrMAJph_yULpGcmkKz2zdJHPsjlLN5954ld/exec"
          method="POST"
          target="iframe_oculto">

      <label for="nome">Nome do Colaborador</label>
      <input type="text" id="nome" name="nome" required>

      <label for="area">Área / Setor</label>
      <input type="text" id="area" name="area" required>

      <label for="qtd">Qtnd.</label>
      <input type="number" id="qtd" name="qtd" min="1" value="1" required>

      <label for="produto">Produto</label>
      <select id="produto" name="produto" required>
        <option value="">Selecione o material</option>
        <option value="Caneta">Caneta</option><option value="Lápis">Lápis</option><option value="Tesoura">Tesoura</option>
      </select>

      <button type="submit" id="btnEnviar">Lançar</button>
      <button type="button" class="btn-config">Configurações</button>
      <div id="mensagem"></div>
    </form>
  </div>

  <iframe name="iframe_oculto"></iframe>

  <script>
    let clicou = false;

    document.getElementById("formSuprimentos").addEventListener("submit", () => {
      clicou = true;
      document.getElementById("btnEnviar").disabled = true;
      document.getElementById("btnEnviar").textContent = "Enviando...";
      document.getElementById("mensagem").textContent = "";
    });

    window.enviado = function(){
      if(clicou){
        const iframe = document.getElementsByName("iframe_oculto")[0];
        const resposta = iframe.contentDocument.body.innerText;

        if(resposta.includes("sucesso")){
          document.getElementById("mensagem").textContent = "Lançamento registrado com sucesso!";
          document.getElementById("mensagem").className = "sucesso";
          document.getElementById("formSuprimentos").reset();
          document.getElementById("qtd").value = 1;
        } else {
          document.getElementById("mensagem").textContent = "Erro ao lançar: " + resposta;
          document.getElementById("mensagem").className = "erro";
        }
        document.getElementById("btnEnviar").disabled = false;
        document.getElementById("btnEnviar").textContent = "Lançar";
        clicou = false;
      }
    }

    document.getElementsByName("iframe_oculto")[0].onload = window.enviado;
  </script>
</body>
</html>
