<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lançamento de Materiais - Magalu</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
   .container { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 420px; }
    h2 { text-align: center; color: #0052cc; margin-bottom: 25px; }
    label { font-weight: 600; display: block; margin-top: 15px; margin-bottom: 6px; color: #333; }
    input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; background: #f8f9fa; }
    input:focus, select:focus { outline: none; border-color: #0052cc; background: white; }
    button { width: 100%; padding: 14px; margin-top: 15px; background: #0052cc; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #003d99; }
    button:disabled { background: #aaa; cursor: not-allowed; }
   .btn-config { background: #6c757d; font-size: 14px; padding: 10px; margin-top: 10px; }
   .btn-config:hover { background: #5a6268; }
    #mensagem { text-align: center; margin-top: 15px; font-weight: bold; min-height: 22px; }
   .sucesso { color: #28a745; }
   .erro { color: #dc3545; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Lançamento de Materiais</h2>
    <form id="formSuprimentos">

      <label for="nome">Nome do Colaborador</label>
      <input type="text" id="nome" name="nome" required>

      <label for="area">Área / Setor</label>
      <input type="text" id="area" name="area" required>

      <label for="qtd">Qtnd.</label>
      <input type="number" id="qtd" name="qtd" min="1" value="1" required>

      <label for="produto">Produto</label>
      <select id="produto" name="produto" required>
        <option value="">Selecione o material</option>
        <option value="Apontador">Apontador</option><option value="Barbante">Barbante</option><option value="Bexiga">Bexiga</option>
        <option value="Caderno grande">Caderno grande</option><option value="Caderno Médio">Caderno Médio</option><option value="Caderno pequeno">Caderno pequeno</option>
        <option value="Caixa De arquivo">Caixa De arquivo</option><option value="Caneta">Caneta</option><option value="Cartolina">Cartolina</option>
        <option value="Clipes">Clipes</option><option value="Cola">Cola</option><option value="Cola Bastão">Cola Bastão</option>
        <option value="Copo Azul">Copo Azul</option><option value="Copo Branco">Copo Branco</option><option value="Elástico">Elástico</option>
        <option value="Etiqueta">Etiqueta</option><option value="Fita crepe">Fita crepe</option><option value="Fita de embalagens">Fita de embalagens</option>
        <option value="Fita Embalagem">Fita Embalagem</option><option value="Fita Zebrada">Fita Zebrada</option><option value="Flipchart">Flipchart</option>
        <option value="Grampeador">Grampeador</option><option value="Grampos">Grampos</option><option value="Guardanapo">Guardanapo</option>
        <option value="Lápis">Lápis</option><option value="Linha De Pesca">Linha De Pesca</option><option value="Marca texto">Marca texto</option>
        <option value="Papel Pardo">Papel Pardo</option><option value="Pasta De Documentos">Pasta De Documentos</option><option value="Pilha AA">Pilha AA</option>
        <option value="Pilha AAA">Pilha AAA</option><option value="Pincel atômico">Pincel atômico</option><option value="Pincel permanente">Pincel permanente</option>
        <option value="Pincel Quadro branco">Pincel Quadro branco</option><option value="Post It">Post It</option><option value="Régua">Régua</option>
        <option value="Super bonder">Super bonder</option><option value="Sulfite ( 50 folhas)">Sulfite ( 50 folhas)</option><option value="Tesoura">Tesoura</option>
      </select>

      <button type="submit" id="btnEnviar">Lançar</button>
      <button type="button" class="btn-config" onclick="mostrarConfig()">Configurações</button>
      <div id="mensagem"></div>
    </form>
  </div>

  <script>
    const URL_SCRIPT = "https://script.google.com/a/macros/magazineluiza.com.br/s/AKfycbzZvGw46RJAt4JRXxpQiEAO-YJH7tBas9L3etYkL4x-rt9xra-NAFoRppgZCogd38M/exec"; // COLE A URL DO APPS SCRIPT COM /a/macros/magazineluiza.com.br/

    document.getElementById("formSuprimentos").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btnEnviar");
      const msg = document.getElementById("mensagem");
      
      btn.disabled = true; 
      btn.textContent = "Enviando..."; 
      msg.textContent = "";

      const formData = new FormData(e.target);

      try {
        const resposta = await fetch(URL_SCRIPT, {
          method: 'POST',
          body: formData,
          credentials: 'include' // IMPORTANTE: Envia o login da conta @magazineluiza.com.br
        });
        
        const texto = await resposta.text();
        if(texto.includes("sucesso")){
          msg.textContent = "Lançamento registrado com sucesso!"; 
          msg.className = "sucesso";
          e.target.reset(); 
          document.getElementById("qtd").value = 1;
        } else {
          msg.textContent = "Erro: " + texto; 
          msg.className = "erro";
        }

      } catch(error) { 
        msg.textContent = "Erro 401: Faça login com @magazineluiza.com.br e autorize o app"; 
        msg.className = "erro"; 
      }

      btn.disabled = false; 
      btn.textContent = "Lançar";
    });

    function mostrarConfig(){ 
      alert("Versão 1.0\nDesenvolvido por Ana Laura Aparecida Pereira Costa\nFacilities - Compras Corporativas"); 
    }
  </script>
</body>
</html>
