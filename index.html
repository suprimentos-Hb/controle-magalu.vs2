<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lançamento - Materiais de Escritório</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { 
      background: #f5f5f5; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      margin: 0; 
      padding: 20px;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      text-align: center;
      color: #0052cc;
      margin-bottom: 20px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      color: #333;
    }
    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      background: #0052cc;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #003d99; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    #mensagem {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }
    .sucesso { color: green; }
    .erro { color: red; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Lançamento de Materiais</h2>
    
    <form id="formSuprimentos">
      
      <label for="nome">Nome do Colaborador</label>
      <input type="text" id="nome" placeholder="Digite o colaborador" required>

      <label for="area">Área / Setor</label>
      <input type="text" id="area" placeholder="Ex: CSC, MTG, Fiscal..." required>

      <label for="qtd">Quantidade</label>
      <input type="number" id="qtd" placeholder="Ex: 1" min="1" value="1" required>

      <label for="produto">Produto</label>
      <select id="produto" required>
        <option value="">Selecione o material</option>
        <opition value="Apontador">Apontador</option>
        <option value="Barbante">Barbante</option>
        <option value="Bexiga">Bexiga</option>
        <opition value="Borracha">Borracha</opition>    
        <option value="Caderno grande">Caderno grande</option>
        <option value="Caderno Médio">Caderno Médio</option>
        <option value="Caderno pequeno">Caderno pequeno</option>
        <opition value= "Caixa de Arquivo">Caixa de Arquivo</opition>    
        <option value="Caneta">Caneta</option>
        <option value="Cartolina">Cartolina</option>
        <option value="Clipes">Clipes</option>
        <option value="Cola">Cola</option>
        <option value="Cola Bastão">Cola Bastão</option>
        <option value="Elástico">Elástico</option>
        <option value="Etiqueta">Etiqueta</option>
        <option value="Fita crepe">Fita crepe</option>
        <option value="Fita de embalagens">Fita de embalagens</option>
        <option value="Fita Embalagem">Fita Embalagem</option>
        <option value="Fita Zebrada">Fita Zebrada</option>
        <option value="Flipchart">Flipchart</option>
        <option value="Grampeador">Grampeador</option>
        <option value="Grampos">Grampos</option>
        <opition value= "Guardanapo">Guardanapo</opition>    
        <option value="Lápis">Lápis</option>
        <option value="Linha De Pesca">Linha De Pesca</option>
        <option value="Marca texto">Marca texto</option>
        <option value="Marca Texto">Marca Texto</option>
        <opition value "Pacote de Copos Azul">Pacote de Copos Azul</opition> 
        <opition value="Pacote de Copos Branco">Pacote de Copos Branco"</opition>    
        <option value="Papel Pardo">Papel Pardo</option>
        <option value="Pasta De Documentos">Pasta De Documentos</option>
        <option value="Pilha AA">Pilha AA</option>
        <option value="Pilha AAA">Pilha AAA</option>
        <option value="Pincel atômico">Pincel atômico</option>
        <option value="Pincel permanente">Pincel permanente</option>
        <option value="Pincel Quadro branco">Pincel Quadro branco</option>
        <option value="Post It">Post It</option>
        <option value="Régua">Régua</option>
        <option value="Super bonder">Super bonder</option>
        <option value="Sulfite ( 50 folhas)">Sulfite ( 50 folhas)</option>
        <opiton value"Tesoura">Tesoura</opiton>    
      </select>

      <button type="submit" id="btnEnviar">Lançar</button>
      <div id="mensagem"></div>
    </form>
  </div>

  <script>
    const URL_API = "https://script.google.com/macros/s/AKfycbwG7WztphNFebd8G5wDsDYTDpQzEvaEjZK8GxrwRf835Gk6qnwoXIoKadVxJr6pEJzi/exec";
    const form = document.getElementById("formSuprimentos");
    const btn = document.getElementById("btnEnviar");
    const msg = document.getElementById("mensagem");

    form.addEventListener("submit", function(e) {
      e.preventDefault();
      
      btn.disabled = true;
      btn.textContent = "Enviando...";
      msg.textContent = "";
      msg.className = "";

      const dados = {
        nome: document.getElementById("nome").value,
        area: document.getElementById("area").value,
        qtd: document.getElementById("qtd").value,
        produto: document.getElementById("produto").value
      };

      fetch(URL_API, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(dados)
      })
      .then(() => {
        msg.textContent = "Lançamento registrado com sucesso!";
        msg.className = "sucesso";
        form.reset();
        document.getElementById("qtd").value = 1;
      })
      .catch((err) => {
        msg.textContent = "Erro ao enviar. Tente novamente.";
        msg.className = "erro";
        console.error(err);
      })
      .finally(() => {
        btn.disabled = false;
        btn.textContent = "Lançar";
      });
    });
  </script>

</body>
</html>
