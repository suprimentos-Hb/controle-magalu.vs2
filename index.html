<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lançamento - Materiais de Escritório</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    h2 { text-align: center; color: #0052cc; margin-bottom: 20px; }
    label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; color: #333; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
    .btn-group { display: flex; gap: 10px; }
    button { width: 100%; padding: 12px; margin-top: 20px; background: #0052cc; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:hover { background: #003d99; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    .btn-voltar { background: #6c757d; }
    .btn-voltar:hover { background: #5a6268; }
    #mensagem { text-align: center; margin-top: 15px; font-weight: bold; min-height: 20px; }
    .sucesso { color: green; }
    .erro { color: red; }
    iframe { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Lançamento de Materiais</h2>
    
    <!-- ENVIA DIRETO PRO SCRIPT - SEM CORS -->
    <form id="formSuprimentos" target="hidden_iframe" method="POST" action="https://script.google.com/macros/s/AKfycbwbtU4iKg66UtJCuEoq43CnrDP3ja16H-UBX7s7aQomJ_Rc5-ltUNPpNLu-m7p62cWu/exec">
      <label for="nome">Nome do Colaborador</label>
      <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

      <label for="area">Área / Setor</label>
      <input type="text" id="area" name="area" placeholder="Ex: CSC, MTG, Fiscal..." required>

      <label for="qtd">Quantidade</label>
      <input type="number" id="qtd" name="qtd" placeholder="Ex: 1" min="1" value="1" required>

      <label for="produto">Produto</label>
      <select id="produto" name="produto" required>
        <option value="">Selecione o material</option>
        <option value="Apontador">Apontador</option><option value="Barbante">Barbante</option><option value="Bexiga">Bexiga</option>
        <option value="Caderno grande">Caderno grande</option><option value="Caderno Médio">Caderno Médio</option><option value="Caderno pequeno">Caderno pequeno</option>
        <option value="Caixa De arquivo">Caixa De arquivo</option><option value="Caneta">Caneta</option><option value="Cartolina">Cartolina</option>
        <option value="Clipes">Clipes</option><option value="Cola">Cola</option><option value="Cola Bastão">Cola Bastão</option>
        <option value="Copo Azul">Copo Azul</option><option value="Copo Branco">Copo Branco</option><option value="Elástico">Elástico</option>
        <option value="Etiqueta">Etiqueta</option><option value="Fita crepe">Fita crepe</option><option value="Fita de embalagens">Fita de embalagens</option>
        <option value="Fita Embalagem">Fita Embalagem</option><option value="Fita Zebrada">Fita Zebrada</option><option value="Flipchart">Flipchart</option>
        <option value="Grampeador">Grampeador</option><option value="Grampos">Grampos</option><option value="Guardanapo">Guardanapo</option>
        <option value="Lápis">Lápis</option><option value="Linha De Pesca">Linha De Pesca</option><option value="Marca texto">Marca texto</option>
        <option value="Marca Texto">Marca Texto</option><option value="Papel Pardo">Papel Pardo</option><option value="Pasta De Documentos">Pasta De Documentos</option>
        <option value="Pilha AA">Pilha AA</option><option value="Pilha AAA">Pilha AAA</option><option value="Pincel atômico">Pincel atômico</option>
        <option value="Pincel permanente">Pincel permanente</option><option value="Pincel Quadro branco">Pincel Quadro branco</option>
        <option value="Post It">Post It</option><option value="Régua">Régua</option><option value="Super bonder">Super bonder</option>
        <option value="Sulfite ( 50 folhas)">Sulfite ( 50 folhas)</option><option value="Tesoura">Tesoura</option>
      </select>

      <div class="btn-group">
        <button type="button" class="btn-voltar" onclick="window.location.href='configuracoes.html'">Voltar</button>
        <button type="submit" id="btnEnviar">Lançar</button>
      </div>
      <div id="mensagem"></div>
    </form>
  </div>

  <!-- IFRAME ESCONDIDO -->
  <iframe name="hidden_iframe" id="hidden_iframe"></iframe>

  <script>
    const form = document.getElementById("formSuprimentos");
    const btn = document.getElementById("btnEnviar");
    const msg = document.getElementById("mensagem");

    form.addEventListener("submit", function() {
      btn.disabled = true;
      btn.textContent = "Enviando...";
      msg.textContent = "Aguarde...";
      msg.className = "";
      
      // Aguarda 2 segundos e mostra sucesso
      setTimeout(() => {
        msg.textContent = "Lançamento registrado com sucesso!";
        msg.className = "sucesso";
        form.reset();
        document.getElementById("qtd").value = 1;
        btn.disabled = false;
        btn.textContent = "Lançar";
      }, 2000);
    });
  </script>
</body>
</html>
